<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>EverDue has moved</title>
<link rel="canonical" href="https://arcadapt.github.io/arcadapt-register/">
<!-- No-JS fallback. The script below normally beats this by ~3 seconds. -->
<meta http-equiv="refresh" content="3;url=https://arcadapt.github.io/arcadapt-register/">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #12191c; color: #e8e8e8;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main {
    max-width: 460px; width: 100%; background: #20252b; border: 1px solid #3a444d;
    border-radius: 14px; padding: 28px 26px; text-align: left;
  }
  .kicker { font-size: 11.5px; letter-spacing: 2px; color: #2596ab; font-weight: 800; margin-bottom: 8px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { margin: 0 0 12px; color: #c6d0d6; }
  a.go {
    display: inline-block; margin: 6px 0 14px; padding: 12px 18px; border-radius: 9px;
    background: #2596ab; color: #08191d; font-weight: 700; text-decoration: none;
  }
  .small { font-size: 12.5px; color: #93a4ab; margin-bottom: 0; }
</style>
</head>
<body>
<main>
  <div class="kicker">EVERDUE</div>
  <h1>This address has moved</h1>
  <p>It used to serve an old beta (V0.04) and is no longer maintained.</p>
  <p><a class="go" id="go" href="https://arcadapt.github.io/arcadapt-register/">Open EverDue &rarr;</a></p>
  <p class="small">Taking you there now. If you installed the old version to your home screen, delete it and install again from the new address &mdash; otherwise you will keep opening the old one.</p>
</main>
<script>
/* Retire the V0.04 shell properly. Its service worker was cache-first for the
   document, so a device that installed it would otherwise keep serving the old
   app forever and never see this page. Order matters: unregister the worker and
   drop its caches BEFORE navigating, so nothing can answer from cache on the
   way out. caches/registrations here are scoped to everdue-app.github.io only —
   the live apps sit on arcadapt.github.io, a different origin, and are untouched. */
var DEST = "https://arcadapt.github.io/arcadapt-register/";
(function () {
  var done = false;
  function leave() { if (done) { return; } done = true; try { location.replace(DEST); } catch (e) { location.href = DEST; } }
  setTimeout(leave, 2500);                       /* never hang on a wedged SW call */
  Promise.resolve()
    .then(function () {
      if (!("serviceWorker" in navigator)) { return null; }
      return navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister().catch(function () {}); }));
      }).catch(function () {});
    })
    .then(function () {
      if (!window.caches) { return null; }
      return caches.keys().then(function (ks) {
        return Promise.all(ks.map(function (k) { return caches.delete(k).catch(function () {}); }));
      }).catch(function () {});
    })
    .then(leave, leave);
}());
</script>
</body>
</html>
